    <link rel="stylesheet" href="/runtime/base.css" />

          <svg width="16" height="11" viewBox="0 0 16 11" aria-hidden="true"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.2C13.3 1.5 10.8.5 8 .5S2.7 1.5.8 3.4L2 4.6c1.6-1.5 3.7-2.4 6-2.4zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.2-1.2C11.5 4.6 9.8 3.9 8 3.9s-3.5.7-4.8 1.9l1.2 1.2c1-.9 2.2-1.4 3.6-1.4zM8 9l2.4-1.6C9.7 6.9 8.9 6.6 8 6.6s-1.7.3-2.4.8L8 9z"/></svg>

      </div>

          <svg width="12" height="20" viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>

        <div class="nb-title"></div>
        <div class="nb-capsule" aria-hidden="true">
          <span class="cap-dots"><i></i><i></i><i></i></span>
          <span class="cap-split"></span>
          <span class="cap-close"><i></i></span>
        </div>
      </div>
      <div id="viewport"></div>
      <div id="tabbar"></div>
      <div id="overlays"></div>
    </div>
    <script src="/runtime/runtime.js"></script>
  </body>
</html>
