name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prepaid
          POSTGRES_PASSWORD: prepaid
          POSTGRES_DB: prepaid_member
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prepaid -d prepaid_member"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 只连接本工作流里的临时数据库，不打印该值，也不连接生产库。
      DATABASE_URL: postgresql://prepaid:prepaid@localhost:5432/prepaid_member?schema=public
      ESIGN_PRODUCTION_ENABLED: "false"
      JWT_SECRET: ci-only-jwt-secret
      WECHAT_PHONE_MOCK: "false"
      RUN_DB_TESTS: "1"
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: prisma validate
        run: pnpm --filter api exec prisma validate

      - name: prisma generate
        run: pnpm --filter api exec prisma generate

      - name: prisma migrate
        run: pnpm --filter api exec prisma migrate deploy

      - name: lint
        run: pnpm -r lint

      - name: typecheck
        run: pnpm -r typecheck

      # 每个包自己的 test 脚本都会跑（没有 test 脚本的包跳过）。新包加测试不用改这里。
      - name: unit tests
        run: pnpm -r --if-present test

  # 正式环境部署包：用真正的 Dockerfile 和 ./prepaid.sh 在一台空机器上从零装一遍，
  # 建公司、走 HTTPS、加密备份、恢复演练、真恢复、升级。域名用 *.localhost（Caddy 自己发证书），密钥都是临时生成的。
  deploy-package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: deploy
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: script syntax
        run: |
          for f in backup/*.sh; do sh -n "$f"; done
          bash -n prepaid.sh

      - name: install
        run: |
          cp env.example .env
          sed -i \
            -e 's/^API_DOMAIN=.*/API_DOMAIN=api.localhost/' \
            -e 's/^ADMIN_DOMAIN=.*/ADMIN_DOMAIN=admin.localhost/' \
            -e 's/^ACME_EMAIL=.*/ACME_EMAIL=ci@example.com/' \
            -e 's/^BACKUP_PASSPHRASE=.*/BACKUP_PASSPHRASE=ci-only-passphrase/' \
            -e 's/^NPM_REGISTRY=.*/NPM_REGISTRY=/' \
            -e 's/^APK_MIRROR=.*/APK_MIRROR=/' \
            -e 's/^PRISMA_ENGINES_MIRROR=.*/PRISMA_ENGINES_MIRROR=/' \
            .env
          ./prepaid.sh install

      - name: create company and check https
        run: |
          printf '%s\n' 'CI 测试公司' '一号店' '13800000009' '测试管理员' | ./prepaid.sh init-company > /dev/null
          # 只能建一次
          if printf '%s\n' 'again' 'again' '13800000008' 'again' | ./prepaid.sh init-company; then exit 1; fi
          curl -fsS -k --retry 10 --retry-all-errors --retry-delay 3 --resolve api.localhost:443:127.0.0.1 https://api.localhost/health | grep '"db":"up"'
          curl -fsS -k --resolve admin.localhost:443:127.0.0.1 https://admin.localhost/ | grep -q '<div id="app">'
          # 正式环境不开接口文档
          test "$(curl -s -k -o /dev/null -w '%{http_code}' --resolve api.localhost:443:127.0.0.1 https://api.localhost/docs)" = 404

      - name: backup, drill and restore
        run: |
          ./prepaid.sh backup
          ./prepaid.sh drill
          printf '确认恢复\n' | ./prepaid.sh restore latest
          curl -fsS -k --retry 10 --retry-all-errors --retry-delay 3 --resolve api.localhost:443:127.0.0.1 https://api.localhost/health | grep '"db":"up"'
          ./prepaid.sh status

      - name: upgrade
        run: ./prepaid.sh upgrade

      - name: logs
        if: failure()
        run: docker compose --env-file .env -f docker-compose.yml logs --tail 100
