services:
  postgres:
    image: postgres:16-alpine
    container_name: prepaid-member-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prepaid
      POSTGRES_PASSWORD: prepaid
      POSTGRES_DB: prepaid_member
    ports:
      - "5432:5432"
    volumes:
      - prepaid_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepaid -d prepaid_member"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 合同 PDF 对象存储占位。默认不启动：docker compose --profile storage up -d
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-local-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - prepaid_minio_data:/data

volumes:
  prepaid_pg_data:
  prepaid_minio_data:
