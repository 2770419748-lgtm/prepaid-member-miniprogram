# 正式环境：一台服务器上跑数据库、接口、商家后台（含 HTTPS）和每日备份。
# 不要直接 docker compose up，用 ./prepaid.sh（会先检查 deploy/.env、跑数据库迁移）。
# 配置都在 deploy/.env（从 env.example 复制）。只有 web 对外开 80/443，数据库和接口不对外。

name: prepaid

x-build: &build
  context: ..
  dockerfile: deploy/Dockerfile
  args:
    NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    APK_MIRROR: ${APK_MIRROR:-}
    PRISMA_ENGINES_MIRROR: ${PRISMA_ENGINES_MIRROR:-}

x-database-url: &database-url postgresql://prepaid:${POSTGRES_PASSWORD:?deploy/.env 里没有 POSTGRES_PASSWORD}@postgres:5432/prepaid_member?schema=public

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prepaid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env 里没有 POSTGRES_PASSWORD}
      POSTGRES_DB: prepaid_member
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepaid -d prepaid_member"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: &logging
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  migrate:
    image: prepaid-migrate
    build:
      <<: *build
      target: migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles: ["tools"]
    logging: *logging

  api:
    image: prepaid-api
    build:
      <<: *build
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      JWT_SECRET: ${JWT_SECRET:?deploy/.env 里没有 JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      MINIPROGRAM_JWT_EXPIRES_IN: ${MINIPROGRAM_JWT_EXPIRES_IN:-30d}
      WECHAT_PHONE_MOCK: "false"
      WECHAT_MEMBER_APPID: ${WECHAT_MEMBER_APPID:-}
      WECHAT_MEMBER_SECRET: ${WECHAT_MEMBER_SECRET:-}
      WECHAT_MEMBER_CODE_ENV: ${WECHAT_MEMBER_CODE_ENV:-release}
      SIGN_MODE: ${SIGN_MODE:-paper}
      ESIGN_APP_ID: ${ESIGN_APP_ID:-}
      ESIGN_APP_SECRET: ${ESIGN_APP_SECRET:-}
      ESIGN_API_HOST: ${ESIGN_API_HOST:-https://smlopenapi.esign.cn}
      ESIGN_PRODUCTION_ENABLED: ${ESIGN_PRODUCTION_ENABLED:-false}
      ESIGN_NOTIFY_URL: https://${API_DOMAIN}/webhooks/esign
      ESIGN_REDIRECT_URL: ${ESIGN_REDIRECT_URL:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      CORS_ORIGINS: https://${ADMIN_DOMAIN}
    volumes:
      # 没配对象存储时合同 PDF 存这里；每日备份也会把这里打包。
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  web:
    image: prepaid-web
    build:
      <<: *build
      target: web
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        APK_MIRROR: ${APK_MIRROR:-}
        PRISMA_ENGINES_MIRROR: ${PRISMA_ENGINES_MIRROR:-}
        API_ORIGIN: https://${API_DOMAIN:?deploy/.env 里没有 API_DOMAIN}
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?deploy/.env 里没有 ADMIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # 证书存这里，重建容器不会重新申请。
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    logging: *logging

  backup:
    image: prepaid-backup
    build:
      <<: *build
      target: backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: prepaid
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: prepaid_member
      BACKUP_TIME: ${BACKUP_TIME:-03:30}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_LOCAL_DAYS: ${BACKUP_LOCAL_DAYS:-7}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-db-backups}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_S3_PROVIDER: ${BACKUP_S3_PROVIDER:-Alibaba}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    volumes:
      - backups:/backups
      - storage:/data/storage:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
  storage:
  backups:
  caddy_data:
  caddy_config:
